<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Hunt">
  <title>The Hunt</title>
  <!--
    The two worlds and the Barrier between them, at the smallest size the
    site's language still reads: a gold half (Earth 1) and a violet half
    (Earth 2) of one sphere, split by a jagged seam of void. Palette values are
    the literals from the Global Constraints — a standalone file in public/
    is served as-is and cannot reach the stylesheet's custom properties.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0b12"/>
  <path d="M16 5a11 11 0 0 0 0 22z" fill="#e8c873"/>
  <path d="M16 5a11 11 0 0 1 0 22z" fill="#9b6bf0"/>
  <path d="M16 4 L13.5 8 L18 12 L13 16 L18.5 20 L14 24 L16 28"
        fill="none" stroke="#0a0b12" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
